name: MirrorTV
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_IDENTITY: ""
targets:
  MirrorTV:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - MirrorApp.swift
          - Assets.xcassets
    dependencies:
      - target: MirrorTVExt
    info:
      path: App-Info.plist
      properties:
        CFBundleDisplayName: Mirror TV
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Serve per trasmettere lo schermo alla TV sulla rete Wi-Fi.
        NSPhotoLibraryUsageDescription: Serve per selezionare foto e video dalla galleria da proiettare sulla TV.
        NSBonjourServices:
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationQueriesSchemes:
          - spotify
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mirrortvb
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MirrorTVExt:
    type: app-extension
    platform: iOS
    sources:
      - path: .
        includes:
          - SampleHandler.swift
    info:
      path: Ext-Info.plist
      properties:
        CFBundleDisplayName: Mirror TV
        NSLocalNetworkUsageDescription: Serve per trasmettere lo schermo alla TV sulla rete Wi-Fi.
        NSBonjourServices:
          - _http._tcp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mirrortvb.ext
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "3"
